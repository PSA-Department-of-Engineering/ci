# The org's dependency gate: every npm and Python bundle a repo ships, audited for
# known advisories. The app bundle must audit clean (REF-Foundry section 4); the docs
# bundle is not the bar and is not audited. audit.py beside this file says what a
# bundle is and what counts as a finding.
#
# A repo records an advisory it accepts (no fix it can take, and not affected by it,
# in VEX's not_affected terms) in a root accepted-advisories.yaml, defined by
# accepted-advisories.schema.json beside this file and validated on every run. With
# none, nothing is accepted.
#
# Report-only (#20): every failure is printed and written to the job summary, and the
# step succeeds; the calling job also continues past a step that errors. #21 makes it
# fail the build.
name: Dependency audit
description: Audit every npm and Python bundle the repo ships; a repo-level accepted-advisories.yaml records the advisories it accepts.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    # The same jsonschema constraint this repo's own test workflow installs to test audit.py.
    - shell: bash
      run: python -m pip install --quiet "pip-audit>=2.10,<3" "jsonschema>=4.18,<5" pyyaml

    - shell: bash
      run: python "$GITHUB_ACTION_PATH/audit.py" --report-only
