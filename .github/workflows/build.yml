# Reusable build + release for homelab repos (ADR-019, ADR-024).
#
# A thin per-repo caller invokes this. It runs on the in-cluster ARC dind runners,
# derives a SemVer from Conventional Commits with semantic-release (tag + GitHub
# release), then builds and pushes whatever artifacts the repo ships to GHCR at
# that version: the app image(s) (devops/), the Helm chart (k8s/), and the docs
# site (docs/Dockerfile). Each step is skipped when its input is absent, so the
# platform repo (docs-only) and a full app share one workflow. CI never deploys:
# promotion is ArgoCD Image Updater (ADR-022).
#
# Before any release, a conformance job runs the per-app conformance suite from
# this repo's conformance/ directory (the single home of the chart-side
# INT-FOUNDRY claims: devops/, k8s/, docs/ honoring DOCS_BASE, README sections,
# .env.example, intent.yaml, route and identity bindings) and audits the app's
# intent.yaml with csd-intent. It runs in the app's own CI, where the app is
# checked out; the platform repo keeps the install-side suite. release `needs`
# it, so a non-conformant repo is never tagged or published. The docs-only
# platform portal is not an onboardable app and opts out with app-contract: false.
#
# The suite judges the checkout as the app named by app-name: the fleet name the
# install manifest carries, which every platform artifact is keyed on (the app's
# Gateway, keycloak-<app>, pg-app-<app>). It defaults to the repo name, the same
# string for most repos; a repo whose name differs from the app it ships names
# the app explicitly, so the identity checks judge the app rather than the
# repository that happens to hold it.
#
# App images come from devops/docker-compose.yml, a repo's single source of truth
# for the images it ships (ADR-018): every service with a build: section is built
# and pushed, named by its compose image:. So a one-image app and a multi-image app
# (e.g. an API plus web frontends) share this workflow with no per-repo edits. A
# repo with no compose falls back to a single devops/Dockerfile named for the app.
#
# GHCR repository names must be lowercase; an owner/repo may carry uppercase
# (e.g. PSA-Department-of-Engineering), so every ref is lowercased before use.
name: build

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          ARC runner scale set to run on. Every job below reads this through
          `github.event.repository.fork && 'ubuntu-latest' || inputs.runner`: a FORK of
          an app repo has no access to this org's self-hosted scale set, so on a fork
          every job would sit in "waiting for a runner" forever and the repo would be
          readable but not buildable. Falling a fork back to a GitHub-hosted runner is
          what makes an open-sourced app repo actually forkable (foundry-platform
          ADR-037 governs OUR runs, which still go to ARC - a fork's runs are not ours).
          A fork PR opened against the canonical repo runs in the canonical repo's
          context, so it stays on ARC; only the forker's own pushes go GitHub-hosted.
        type: string
        default: arc-dind
      app-name:
        description: >-
          The app's fleet name: its entry in the install manifest, and the string
          every platform artifact is keyed on (the app's Gateway, keycloak-<app>,
          pg-app-<app>). The conformance suite judges the checkout as this app.
          Defaults to the repo name; a repo whose name differs from the app it
          ships passes the fleet name here.
        type: string
        default: ${{ github.event.repository.name }}
      image-name:
        description: GHCR base name for the docs image and the single-Dockerfile fallback. Empty defaults to the app name.
        type: string
        default: ''
      docs-base:
        description: Base path for the docs site. Empty defaults to /apps/<app name>; the platform portal passes "/".
        type: string
        default: ''
      app-contract:
        description: >-
          Audit the repo against the REF-Foundry section 4 app contract (and run
          csd-intent on its intent.yaml) before releasing. Onboardable apps leave this
          true; the docs-only platform portal sets it false.
        type: boolean
        default: true
      release-comments:
        description: >-
          When true, semantic-release comments "released in vX.Y.Z" on the issues
          and PRs a release closes. Off by default: the GitHub plugin needs the
          token to carry issues:write and pull-requests:write, so a caller that
          opts in must also grant those permissions, or the release step fails.
        type: boolean
        default: false
      platform-repo:
        description: >-
          The platform repository (owner/name) whose deploy-* branches carry the
          install manifests and each app's promotion record. The reconcile check
          (INT-FOUNDRY-061) reads it read-only; the fleet runs one platform repo,
          so the default is right for every app.
        type: string
        default: PSA-Department-of-Engineering/foundry-platform
    secrets:
      PLATFORM_READ_TOKEN:
        required: false
        description: >-
          A read-only PAT for the platform repository (contents read), arming the
          reconcile check (INT-FOUNDRY-061): the app's released set against the
          promotion record the install branches carry for it. Unset, the check
          reports a named skip - the drift brake is off, never silently green.
      PACKAGES_READ_TOKEN:
        required: false
        description: >-
          A GitHub PAT for pushing images to an org GHCR namespace (needs
          write:packages) when the org caps the Actions token to read. Falls back to
          GITHUB_TOKEN when unset, which suffices for a personal-namespace push. This
          is an IMAGE-registry credential only: it once also covered installing
          @psa-department-of-engineering/* npm packages during the docs build, but
          those are on the public npm registry now (csd-library ADR-0003) and need no
          credential at all.

# No top-level permissions block, deliberately: a called workflow may request
# only a SUBSET of what its caller grants, so declaring permissions here makes
# any caller granting less fail at run creation (startup_failure), and any
# caller granting more (release-comments opt-ins need issues:write +
# pull-requests:write) gets capped to this block. Inheriting means each caller's
# own grant (contents:write + packages:write in the standard thin caller) flows
# through unchanged.

jobs:
  # REF-Foundry section 4: the onboardable-app repo contract. The authoritative
  # per-app suite is conformance/ in THIS repo (pytest + intent markers), run
  # here in each app's own CI, where the app is checked out; the platform repo
  # keeps only the install-side suite (its deploy-* branches), which an app
  # runner cannot read (the platform repo is private and the org token reads
  # packages only). One suite, one home: a hand-mirrored copy of the checks in
  # this workflow is the drift that let 17 claims go unenforced. release `needs`
  # this, so a non-conformant repo is never tagged or published. The docs-only
  # platform portal is not an onboardable app: it passes app-contract: false,
  # which skips every step below. The job still runs and succeeds (no executed
  # step fails), so its release proceeds.
  conformance:
    runs-on: ${{ github.event.repository.fork && 'ubuntu-latest' || inputs.runner }}
    permissions:
      contents: read
    steps:
      - if: ${{ inputs.app-contract }}
        uses: actions/checkout@v4

      - if: ${{ inputs.app-contract }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # csd-intent is the audit CLI (PyYAML installs with it); pytest-intent
      # supplies the @intent decorator the suite imports. PyPI installs (csd-library
      # ADR-0004): the same constraints the platform repo records in its pyproject.toml.
      - if: ${{ inputs.app-contract }}
        name: Install csd-intent, pytest, and the intent runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml \
            "csd-pytest-intent~=0.3.0" \
            "csd-intent~=0.4"

      # Audit the app's own intent.yaml BEFORE the suite checkout below lands in
      # the tree: csd-intent scans the whole checkout for markers, and the
      # suite's own INT-FOUNDRY markers must not enter this app's audit.
      # CSD-INTENT-01 schema + every active claim attested (default --fail-on any).
      - if: ${{ inputs.app-contract }}
        name: Audit intent.yaml (csd-intent)
        run: csd-intent .

      # The per-app conformance suite, from this repo (the single home of the
      # chart-side INT-FOUNDRY claims). Checked out inside the app workspace
      # only after the intent audit above has already read the tree.
      - if: ${{ inputs.app-contract }}
        uses: actions/checkout@v4
        with:
          repository: PSA-Department-of-Engineering/ci
          path: .ci-suite

      - if: ${{ inputs.app-contract }}
        name: Per-app conformance suite (REF-Foundry section 4)
        env:
          CONFORMANCE_APP_DIR: ${{ github.workspace }}
          CONFORMANCE_APP_NAME: ${{ inputs.app-name }}
          # The reconcile check (INT-FOUNDRY-061): the one deliberate
          # platform-facing read in this suite, so drift between what the app
          # releases and what the platform watches bites HERE, on the causer's
          # desk, blocking the release until reconcile_app realigns them.
          PLATFORM_REPO: ${{ inputs.platform-repo }}
          # Falls back to the org's existing PACKAGES_READ_TOKEN (a PAT that
          # already reads the platform repo), so the check arms with the
          # credentials the fleet already holds; a dedicated read-only
          # PLATFORM_READ_TOKEN narrows the blast radius when minted.
          PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN || secrets.PACKAGES_READ_TOKEN }}
        run: pytest .ci-suite/conformance -q

  # The org's two commit invariants (Conventional-Commits subject + no co-author
  # trailer), enforced where every release flows: semantic-release derives the version
  # from the subject type, so a malformed subject silently ships nothing. Unlike
  # conformance this applies to EVERY repo, including the docs-only portal, so it is
  # independent of app-contract. release needs it, so a bad commit is never released.
  commit-hygiene:
    runs-on: ${{ github.event.repository.fork && 'ubuntu-latest' || inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: PSA-Department-of-Engineering/ci/.github/actions/check-commit-hygiene@main

  # The org's secrets gate: fail the run when a pushed commit introduces a credential.
  # Like commit-hygiene this applies to EVERY repo, including the docs-only portal, so it
  # is independent of app-contract. release needs it, so a leaked secret is never released.
  secrets-scan:
    runs-on: ${{ github.event.repository.fork && 'ubuntu-latest' || inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: PSA-Department-of-Engineering/ci/.github/actions/secrets-scan@main

  # Never releases from a pull request: a PR head is a candidate, not a version. The
  # three gates above are safe to run on one (both commit gates already resolve a
  # pull_request's range against its base), so a caller that wires `pull_request:`
  # gets conformance, hygiene, and the secrets scan as PR checks while tag, GitHub
  # release, and every GHCR push stay on the push-to-main path (ADR-019, ADR-024).
  # Skipping here rather than in each caller keeps the release rule in its one home.
  #
  # A no-op for the fleet as it stands: every caller triggers on push alone, and a
  # skipped job still reports a check run (conclusion: skipped), which the console's
  # one-shot merge gate folds into green rather than unknown.
  release:
    if: github.event_name != 'pull_request'
    needs: [conformance, commit-hygiene, secrets-scan]
    runs-on: ${{ github.event.repository.fork && 'ubuntu-latest' || inputs.runner }}
    env:
      # The registry is a value, not an assumption (the platform's #164): an
      # organisation on another registry sets the org-level Actions variable
      # FOUNDRY_REGISTRY (host/namespace, e.g. an ECR path) and authors the login
      # step below for that registry's own credential mechanics; unset, GHCR under
      # this owner. Lowercased at point of use (owner may carry uppercase).
      REG: ${{ vars.FOUNDRY_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      # The docs image and the single-Dockerfile fallback are named for the app;
      # image-name overrides that for a repo whose GHCR base differs.
      APP: ${{ inputs.image-name || inputs.app-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        # One credential, one topology: the workflow token. It writes exactly the
        # packages whose settings grant this repo the Write role (a first push
        # creates the package with that grant in place), and the caller grants
        # `packages: write`. There is no PAT path: org secrets never reach
        # private repos on a free-plan org, so the old PAT-first expression
        # always resolved to this token anyway. A refused push is therefore
        # always the same one fault, and the push helper names it. This login is
        # the GHCR implementation of the CI contract's publish clause: a registry
        # named by FOUNDRY_REGISTRY brings its own login step in its own fork,
        # because registry credentials are vendor-mechanical by nature.
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # SemVer from Conventional Commits. No npm publish: just the tag + GitHub release.
      - name: Release config
        env:
          # successComment is opt-in (release-comments) and needs the token to
          # carry issues:write + pull-requests:write, which the caller must grant;
          # otherwise the GitHub plugin throws resolving the issue and fails the
          # release. Off by default keeps every other caller's releases green.
          RELEASE_COMMENTS: ${{ inputs.release-comments }}
        run: |
          if [ "$RELEASE_COMMENTS" = "true" ]; then
            GH_OPTS='{ "failComment": false, "failTitle": false }'
          else
            GH_OPTS='{ "successComment": false, "failComment": false, "failTitle": false }'
          fi
          # The conventionalcommits preset, NOT the default angular one: hygiene admits the
          # spec's `!` breaking-change marker (feat!:), but angular's header pattern cannot
          # even parse it, so a `!` commit would silently ship nothing. conventionalcommits
          # reads `!` as major and keeps the familiar defaults (feat -> minor, fix -> patch,
          # BREAKING CHANGE footer -> major); the one added rule pins the org-specific
          # `delivery` type to no release, so the console's deterministic .delivery/ scratch
          # commits never cut a version (check-commit-hygiene lets `delivery(...)` through).
          cat > .releaserc.json <<JSON
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", { "preset": "conventionalcommits", "releaseRules": [{ "type": "delivery", "release": false }] }],
              ["@semantic-release/release-notes-generator", { "preset": "conventionalcommits" }],
              ["@semantic-release/github", ${GH_OPTS} ]
            ]
          }
          JSON

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The engine runs directly under npx: an enterprise Actions allowlist
        # admits actions from enterprise-owned repos, GitHub, or an explicit
        # pattern list, so a third-party release action is a host-policy
        # binding this workflow does not carry. npx -p keeps both packages in
        # its own prefix, off the workspace tree that image builds COPY. The
        # preset is a package of its own (semantic-release v24 pairs with
        # conventional-changelog-conventionalcommits v8). A new tag on the
        # checkout after the run is the release; its name carries the version.
        run: |
          set -euo pipefail
          git tag --list > /tmp/tags-before
          npx -y -p semantic-release@24 -p conventional-changelog-conventionalcommits@8 semantic-release
          git tag --list > /tmp/tags-after
          NEW_TAG=$(comm -13 <(sort /tmp/tags-before) <(sort /tmp/tags-after) | head -1)
          if [ -n "$NEW_TAG" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image(s), chart, docs
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
          DOCS_BASE: ${{ inputs.docs-base }}
        run: |
          set -euo pipefail

          # Every registry push reports the one possible fault as its remedy,
          # not as a raw registry error. Images and the chart share the text
          # because they share the credential and the grant rule.
          grant_refused() {
            echo "==> GHCR refused the push. The workflow token is the only credential,"
            echo "    and it writes only packages whose settings grant THIS repo the"
            echo "    Write role (package -> Package settings -> Manage Actions access)."
            echo "    Changing a repo's visibility drops these grants, so re-check every"
            echo "    package the repo publishes after flipping it public or private."
            echo "    Fix the grant, then push a release-cutting commit - re-running"
            echo "    this job republishes nothing once the tag exists."
          }
          push_image() {
            docker push "$1" && return 0
            grant_refused
            return 1
          }
          # cycjimmy/semantic-release-action unconditionally deletes the workspace
          # .npmrc when it finishes (its cleanupNpmrc task, which guards the action's
          # own npm-auth injection). That also removes a repo's COMMITTED root .npmrc
          # and breaks any app image build that COPYs it into the build context (a
          # docs/.npmrc sits outside the action's cwd and is unaffected). Restore
          # deleted/modified tracked files so the build sees the tree as committed.
          git restore .
          REG="$(printf '%s' "$REG" | tr '[:upper:]' '[:lower:]')"
          APP="$(printf '%s' "$APP" | tr '[:upper:]' '[:lower:]')"
          export REG VERSION

          # --- App image(s) ---
          # devops/docker-compose.yml is the single source of truth for the images a
          # repo ships (ADR-018). Build every service that has a build: section and
          # push it as $REG/<compose image:>:$VERSION. The file is parsed, not run, so
          # env_file entries (and a missing .env on a fresh checkout) never matter.
          if [ -f devops/docker-compose.yml ]; then
            npx -y js-yaml@4 devops/docker-compose.yml > /tmp/compose.json
            cat > /tmp/gen-build.js <<'NODE'
          const fs = require('fs'), path = require('path');
          const reg = process.env.REG, version = process.env.VERSION;
          const compose = JSON.parse(fs.readFileSync('/tmp/compose.json', 'utf8'));
          const composeDir = 'devops'; // build.context is relative to the compose file's dir
          const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
          const lines = ['set -euo pipefail'];
          let n = 0;
          for (const [name, svc] of Object.entries(compose.services || {})) {
            if (!svc || !svc.build) continue;
            const b = typeof svc.build === 'string' ? { context: svc.build } : svc.build;
            const base = String(svc.image || name).split('/').pop().split(':')[0].toLowerCase();
            const ctx = path.posix.join(composeDir, b.context || '.');
            const dockerfile = path.posix.join(ctx, b.dockerfile || 'Dockerfile');
            const args = Object.entries(b.args || {})
              .map(([k, v]) => '--build-arg ' + q(k + '=' + (v == null ? '' : v)));
            const tag = reg + '/' + base + ':' + version;
            lines.push('echo "==> building ' + base + '"');
            // No build secret: @psa-department-of-engineering/* resolves from the
            // public npm registry (csd-library ADR-0003), so an SPA stage installs
            // it anonymously.
            lines.push(['DOCKER_BUILDKIT=1 docker build', q(ctx), '-f', q(dockerfile), ...args, '-t', q(tag)].join(' '));
            lines.push('push_image ' + q(tag));
            n++;
          }
          if (n === 0) console.error('compose has no buildable services; no app image built');
          fs.writeFileSync('/tmp/build-images.sh', lines.join('\n') + '\n');
          console.error('image builds generated: ' + n);
          NODE
            node /tmp/gen-build.js
            # Sourced, not exec'd: the generated lines call push_image above.
            . /tmp/build-images.sh
          elif [ -f devops/Dockerfile ]; then
            DOCKER_BUILDKIT=1 docker build -f devops/Dockerfile \
              -t "$REG/$APP:$VERSION" .
            push_image "$REG/$APP:$VERSION"
          fi

          # --- Docs site: base path /apps/<app> by default, "/" for the platform portal.
          # --- The portal's /apps/ index renders from the install manifest inside the
          # --- platform chart (ADR-032), so no registry rides into the docs build. ---
          if [ -f docs/Dockerfile ]; then
            BASE="${DOCS_BASE:-/apps/$APP}"
            # No build secret: docs/Dockerfile's `npm ci` pulls
            # @psa-department-of-engineering/* from the public npm registry
            # (csd-library ADR-0003), which needs no credential.
            DOCKER_BUILDKIT=1 docker build -f docs/Dockerfile \
              --build-arg DOCS_BASE="$BASE" -t "$REG/$APP-docs:$VERSION" docs/
            push_image "$REG/$APP-docs:$VERSION"
            docker tag "$REG/$APP-docs:$VERSION" "$REG/$APP-docs:latest"
            push_image "$REG/$APP-docs:latest"
          fi

          # --- Helm chart (chart name comes from k8s/Chart.yaml; helm reads the
          # docker credential store, same token, same grant rule). ---
          if [ -d k8s ]; then
            helm package k8s --version "$VERSION" --app-version "$VERSION" -d /tmp
            helm push /tmp/*.tgz "oci://$REG/charts" || { grant_refused; exit 1; }
          fi
