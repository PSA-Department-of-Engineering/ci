# Reusable release + publish for library monorepos in this org (npm and/or Python
# packages in one repo). A thin per-repo caller invokes it on push to main.
#
# release-please reads the calling repo's release-please-config.json and
# .release-please-manifest.json, maintains a per-package "release PR" from
# Conventional Commits, and on merge cuts the tag (<pkg>-vX.Y.Z), the GitHub release,
# and the per-package CHANGELOG. Any released package that carries a package.json is
# then published to the public npm registry; Python packages have no upload step
# (consumers pip-install the git tag, per csd-library ADR-0001).
#
# npm publishes go to registry.npmjs.org, not GitHub Packages: GitHub Packages requires
# an auth token to READ even a public package, so a consumer repo cannot be forked and
# built by anyone outside the org. Public npm needs no read credential at all, which is
# what makes a consumer repo forkable. Publishing therefore needs a real npm credential
# (NPM_TOKEN) where the GITHUB_TOKEN used to suffice.
#
# This is the library counterpart to build.yml (which builds + pushes image / chart /
# docs artifacts for deployable services). Libraries use release-please rather than
# semantic-release because one repo here carries several independently-versioned
# packages across two ecosystems, which semantic-release does not model; see
# csd-library ADR-0002.
name: library

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used to build and publish npm packages.
        type: string
        default: '22'
      runner:
        description: Runner to execute on. Defaults to the in-cluster ARC scale set (homelab-platform ADR-037 - all CI on ARC runners, never GitHub-hosted); pass a GitHub-hosted runner (e.g. ubuntu-latest) only to deliberately keep a caller off homelab uptime.
        type: string
        default: arc-dind
    secrets:
      NPM_TOKEN:
        required: false
        description: >-
          An npm granular access token with read+write on the published scope. Required
          to publish any npm package; a repo whose released packages are all Python
          leaves it unset. The publish step fails with a named message rather than a
          registry 401 when a package.json is released without it.

permissions:
  contents: write        # tags + GitHub releases (release-please)
  pull-requests: write   # the release PR (release-please)
  id-token: write        # npm provenance (sigstore attestation via GitHub OIDC)

jobs:
  # The org's two commit invariants (Conventional-Commits subject + no co-author
  # trailer), enforced where every release flows: release-please derives each package's
  # version from the commit type, so a malformed subject silently ships nothing. release
  # needs it, so a bad commit never cuts a release PR.
  commit-hygiene:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: PSA-Department-of-Engineering/ci/.github/actions/check-commit-hygiene@main

  # The org's secrets gate: fail the run when a pushed commit introduces a credential.
  # release needs it, so a leaked secret never cuts a release PR or publishes a package.
  secrets-scan:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: PSA-Department-of-Engineering/ci/.github/actions/secrets-scan@main

  release:
    needs: [commit-hygiene, secrets-scan]
    runs-on: ${{ inputs.runner }}
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}

  # Fans out over the packages release-please actually cut this run. Empty / "[]"
  # whenever the push only opened or updated a release PR (no release), so this job
  # is skipped until a release PR is merged.
  publish-npm:
    needs: release
    if: needs.release.outputs.paths_released != '' && needs.release.outputs.paths_released != '[]'
    # NOT inputs.runner, and the one deliberate exception to homelab ADR-037's
    # all-CI-on-ARC rule: npm refuses a provenance attestation minted on a self-hosted
    # runner ("Only github-hosted runners are supported when publishing with
    # provenance"), so on arc-dind every publish dies at the registry with a 422.
    # Publishing a public artifact to a public registry has no business riding on
    # homelab uptime either - this is the one job whose audience is outside the lab.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
      # --provenance signs the tarball with a sigstore attestation minted from this run's
      # GitHub OIDC token, so npm shows where the package was built from. It needs the
      # id-token: write granted above, which every caller must also grant (a called
      # workflow may request only a SUBSET of its caller's permissions).
      - name: Publish ${{ matrix.path }} to npm (Python packages have no package.json and are skipped — the tag is their release)
        working-directory: ${{ matrix.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -f package.json ]; then
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::error::${{ matrix.path }} is an npm package but no NPM_TOKEN is available to this run. Set it as an org or repo secret; the caller passes it through with 'secrets: inherit'."
              exit 1
            fi
            echo "Publishing ${{ matrix.path }}"
            npm ci
            npm publish --provenance
          else
            echo "${{ matrix.path }} has no package.json (Python package); the git tag is the release, nothing to publish."
          fi
